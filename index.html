<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <img src="photos/form_background.avif" alt="" class="bg-photo" />
      <img src="photos/odin-logo.png" alt="" class="logo-icon" />
      <div class="logo-message">ODIN</div>
    </aside>

    <div class="container">
      <header>
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <span>now</span> to get started.
        </p>
        <p>You <span>know</span> you want to.</p>
      </header>

      <form action="#" method="get">
        <fieldset>
          <legend>Let's do this!</legend>

          <div class="form-group">
            <label for="first_name">FIRST NAME</label>
            <input type="text" id="first_name" name="first_name" required />
          </div>

          <div class="form-group">
            <label for="second_name">SECOND NAME</label>
            <input type="text" id="second_name" name="second_name" required />
          </div>

          <div class="form-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="phone_number">PHONE NUMBER</label>
            <input type="tel" id="phone_number" name="phone_number" required />
          </div>

          <div class="form-group">
            <label for="password">PASSWORD</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="8"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm_password">CONFIRM PASSWORD</label>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              minlength="8"
              required
            />
          </div>
        </fieldset>
      </form>

      <footer>
        <button>Create Account</button>
        <p>Already have an account? <span>Log in</span></p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
